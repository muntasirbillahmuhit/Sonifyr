<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonifyr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1a1a1c;--sub:#6b6b70;--acc:#3f83c4;--chip:#c4c4c6;--mini:#dce1e6;--ln:#e6e6ea;--tog:#e7e0ec;--tgb:#79747e;--sh:0 1px 3px rgba(0,0,0,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1d1d20;--tx:#ececef;--sub:#a0a0a8;--chip:#44474c;--mini:#2a2e33;--ln:#2c2c30;--tog:#36343b;--tgb:#938f99;--sh:none}}
:root[data-theme="dark"]{--bg:#121214;--card:#1d1d20;--tx:#ececef;--sub:#a0a0a8;--chip:#44474c;--mini:#2a2e33;--ln:#2c2c30;--tog:#36343b;--tgb:#938f99;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px 0 0;background:var(--bg);display:flex;flex-direction:column}.page>*{flex:none}.page>.sheetc{flex:1 0 auto}.page>:last-child:not(.sheetc){margin-bottom:110px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 20px}
.top h1{font-size:23px;font-weight:400;margin:0;flex:1}
.pill{border:1.5px solid var(--tgb);border-radius:24px;height:44px;padding:0 14px;display:flex;align-items:center;gap:4px;font-size:16px}
.rnd{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--tgb);display:grid;place-items:center}
.tabs{display:flex;gap:6px;padding:10px 12px 12px;overflow-x:auto;scrollbar-width:none}
.tab{padding:12px 20px;border-radius:20px;font-size:16px;font-weight:500;color:var(--sub);white-space:nowrap}
.tab.on{background:var(--chip);color:var(--tx)}
.tabs.ul .tab{border-radius:0;padding:12px 14px}.tabs.ul .tab.on{background:none;border-bottom:3px solid var(--acc)}
.sheetc{background:var(--card);border-radius:30px 30px 0 0;padding:6px 0 110px}
h2{font-size:21px;font-weight:400;margin:18px 20px 12px}
.row{display:flex;justify-content:space-between;align-items:center;padding-right:20px}.row h2{margin-right:0}
.va{color:var(--acc);font-weight:700;font-size:15px}
.qp{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:92%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.song{display:flex;align-items:center;gap:16px;padding:8px 8px 8px 20px;scroll-snap-align:start;cursor:pointer}
.art{width:68px;height:68px;border-radius:16px;flex:none;display:grid;place-items:center;text-align:center;font-weight:700;font-size:11px;line-height:1.1;color:#fff;padding:4px;overflow:hidden;word-break:break-word}
.song .m{flex:1;min-width:0}.song b{display:block;font-weight:400;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song span{color:var(--sub);font-size:16px}
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.al{width:132px;flex:none;cursor:pointer}.al .art{width:132px;height:132px;border-radius:22px;font-size:15px}
.al p{margin:8px 0 2px;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.al small{color:var(--sub);font-size:13px}
.empty{text-align:center;padding:60px 30px;color:var(--sub)}.empty h3{font-weight:400;color:var(--tx);font-size:22px;margin:10px 0 6px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.plc{aspect-ratio:1;border-radius:30px;display:grid;place-items:center;text-align:center;color:#fff;font-size:21px;font-weight:700;background:#9e9e9e}
.plc small{display:block;font-weight:400;font-size:15px;opacity:.85}
.mini{position:absolute;left:0;right:0;bottom:10px;margin:0 8px;height:76px;border-radius:38px;background:var(--mini);display:flex;align-items:center;gap:14px;padding:0 22px 0 18px;cursor:pointer;z-index:5}
.mini .art{width:52px;height:52px;border-radius:50%;font-size:8px}
.mini .m{flex:1;min-width:0}.mini b{display:block;font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini span{color:var(--sub);font-size:16px}
.mini .ct{display:flex;gap:14px;align-items:center}.mini svg.i{width:30px;height:30px}
.sbar{display:flex;align-items:center;gap:14px;padding:8px 22px}
.sbar input{flex:1;border:0;background:none;font:inherit;font-size:22px;color:var(--tx);outline:0;min-width:0}
.lbl{padding:12px 38px 8px;color:var(--sub);font-size:17px}
.list{background:var(--card);border-radius:30px;margin:4px 0 0}
.rs{display:flex;justify-content:space-between;align-items:center;padding:20px 28px 20px 38px;font-size:17px;cursor:pointer}
.clr{display:block;width:100%;text-align:center;padding:18px;font-weight:500}
.grp{background:var(--card);border-radius:30px;margin:0 24px 14px;overflow:hidden;box-shadow:var(--sh)}
.it{display:flex;align-items:center;gap:20px;padding:16px 22px;cursor:pointer;width:100%;text-align:left}
.it .tx{flex:1;min-width:0}.it .t{font-size:19px;letter-spacing:.3px}.it .s{font-size:14px;color:var(--sub);margin-top:2px;letter-spacing:.3px}.it .s.a{color:var(--acc)}
.sh{margin:22px 26px 10px;font-size:20px;font-weight:700;color:var(--sub)}
.tg{width:56px;height:34px;border-radius:17px;border:2.5px solid var(--tgb);background:var(--tog);position:relative;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--acc);border-color:var(--acc)}.tg.on::after{left:25px;top:2px;width:24px;height:24px}
.note{display:flex;flex-direction:column;gap:12px;padding:6px 38px;font-size:17px;line-height:1.45}
.bar{display:flex;align-items:center;gap:12px;padding:14px 22px}.bar .tr{flex:1;height:10px;border-radius:5px;background:var(--ln);position:relative}.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--acc);min-width:10px}
.bar .cb{background:#e8eef7;color:var(--acc);font-weight:700;padding:12px 18px;border-radius:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar .cb{background:#26313f}}
:root[data-theme="dark"] .bar .cb{background:#26313f}
.about{text-align:center;padding:20px}.about h3{font-weight:400;font-size:26px;margin:14px 0 6px}
#full{position:absolute;inset:0;background:var(--bg);z-index:20;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column;align-items:center;padding:24px 28px calc(30px + env(safe-area-inset-bottom,0px))}
#full.open{transform:none}
#full .art{width:min(78vw,320px);height:min(78vw,320px);border-radius:36px;font-size:30px;margin:26px 0 24px}
#full.cmp .art{width:150px;height:150px;font-size:16px}
#full h3{font-weight:400;font-size:24px;margin:0;text-align:center}#full p{color:var(--sub);margin:6px 0 20px;font-size:18px}
#full .pr{width:100%;position:relative;height:40px;cursor:pointer;touch-action:none}
#full .tm{width:100%;display:flex;justify-content:space-between;color:var(--sub);font-size:14px}
#full .cts{display:flex;gap:28px;align-items:center;margin-top:20px}.cts .big{width:72px;height:72px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}.cts svg.i{width:34px;height:34px}
#sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.4);display:none;align-items:flex-end}#sheet.open{display:flex}
#sheet .bx{width:100%;background:var(--card);border-radius:30px 30px 0 0;padding:14px 8px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .bx .it{padding:16px 24px}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:22px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}#toast.on{opacity:1}
</style>
</head>
<body>

 <div class="page" id="pg"></div>
 <div class="mini" id="mini"></div>
 <div id="full"></div>
 <div id="sheet"><div class="bx" id="bx"></div></div>
 <div id="toast"></div>
</div>

function sres(){const r=q?SONGS.filter(s=>(s.t+s.a).toLowerCase().includes(q.toLowerCase())):[];
 return (q?`<div class="list" style="padding:8px 0">${r.length?r.map(songRow).join(""):'<div class="empty">No results</div>'}</div>`:(S.pauseHist||!S.recent.length?"":`<div class="lbl">Recent Search</div><div class="list">${S.recent.map((x,i)=>`<div class="rs" data-rs="${i}"><span>${x}</span><button data-rm="${i}">${I("close")}</button></div>`).join("")}<button class="clr" id="clr">Clear</button></div>`))}
function search(){return `<div class="sbar"><button data-back>${I("back")}</button><input id="qi" placeholder="Search" value="${q.replace(/"/g,"&quot;")}" autocomplete="off"><button id="mic">${I("mic")}</button></div><div id="sr">${sres()}</div>`}
const nav=(i,t,to)=>({i,t,go:to});
const MB=n=>n<1?n.toFixed(2)+" MB":Math.round(n)+" MB";
const lim=v=>parseFloat(v)*(/GB/.test(v)?1024:1);
const PAGES={
settings:{h:"Settings",c:[[nav("half","Appearance","appearance"),{i:"play",t:"Player",fn:"pl"}],[nav("shield","Privacy","privacy")],[nav("hist","Backup and restore","backup"),nav("db","Database","database")],[nav("half","Cache","cache"),nav("gear","More Settings","more")],[nav("info","About","about")]]},
appearance:{h:"Appearance",c:[{s:"Theme"},[{i:"half",t:"App Theme",k:"theme",o:["System Default","Light","Dark"]}],{s:"Player Style"},[{i:"play",t:"Player Layout",k:"layout",o:["Default","Compact"]}],[{i:"db",t:"Progress Bar Style",k:"prog",o:["Wave","Slider"]},{i:"spark",t:"Background Style",sub:"Choose your preferred background style"}],{s:"Home Screen Tabs"},[{i:"db",t:"Tab Style",k:"tabs",o:["Classic","Underline"]},{i:"db",t:"Home Screen Tabs",sub:"Home, Favorites, Following, Playlists",a:1}]]},
privacy:{h:"Privacy",c:[{s:"Permissions"},[{i:"bell",t:"Notifications",sub:"Allowed"},{i:"music",t:"Audio Permission",sub:"Allowed"},{i:"shield",t:"Install Unknown Apps",sub:"Allowed"}],{s:"Storage"},[{i:"folder",t:"Local Data",sub:"Sonifyr stores cache and database locally on your device."}]]},
backup:{h:"Backup and restore",c:[{s:"Local backup"},[{i:"save",t:"Backup",sub:"Export the database to the external storage",fn:"bk"},{i:"hist",t:"Restore",sub:"Import the database from the external storage",fn:"rs"}],[{i:"sync",t:"Automatic Backup",sub:"Automatically back up your database.",k:"auto",tg:1}],{n:"The app will automatically close itself after restoring the database and existing data will be overwritten."}]},
database:{h:"Database",c:[[{i:"spark",t:"Quick picks source",k:"qsrc",o:["Default","Most played"]},{i:"hist",t:"Pause search history",sub:"Neither save new searched queries nor show history",k:"pauseHist",tg:1}],[{i:"sync",t:"Reset quick picks",sub:()=>`Delete ${S.plays} playback events`,fn:"rq"}]]},
cache:{h:"Cache",c:[{s:"Audio cache"},[{i:"music",t:"Pause song cache",sub:"Pause the song caching process",k:"pauseSong",tg:1}],[{bar:"songMB",max:"songMax"},{i:"music",t:"Max size",k:"songMax",o:["512MB","1GB","2GB","4GB"]},{i:"eye",t:"Show cached songs",sub:"Show cached songs in the offline playlist",k:"showCached",tg:1}],{s:"Image cache"},[{i:"img",t:"Pause image cache",sub:"Pause the image caching process",k:"pauseImg",tg:1}],[{bar:"imgMB",max:"imgMax"},{i:"img",t:"Max size",k:"imgMax",o:["64MB","128MB","256MB","512MB"]}],{n:"When the cache runs out of space, the resources that haven’t been accessed for the longest time are cleared."}]},
more:{h:"More Settings",c:[{s:"General"},[{i:"star",t:"Android Auto",sub:"Enable Android Auto support",k:"aa",tg:1}],[{i:"globe",t:"App language",sub:"Configure app language"},{i:"globe",t:"Open supported links by default",sub:"Configure supported links"}],{s:"Service lifetime"},[{i:"batt",t:"Ignore battery optimizations",sub:"Disable background restrictions"},{i:"star",t:"Service lifetime",sub:"When turning off battery optimizations is not enough",k:"inv",tg:1}],{n:"If battery optimizations are applied, the playback notification can suddenly disappear when paused. Since Android 12, disabling battery optimizations is required for the Invincible service option to take effect."}]},
about:{h:"About",c:[{about:1},[{i:"code",t:"View Source Code"},{i:"bulb",t:"Suggest an Idea"},{i:"bug",t:"Generate bug report"}],[{i:"star",t:"Early access (Beta)",sub:"Enable to receive preview builds.",k:"beta",tg:1},{i:"sync",t:"Seamless Update",sub:"Install updates directly from app",k:"seam",tg:1},{i:"bell",t:"Show update alert",sub:"Get a notification new version is available",k:"alert",tg:1}]]}};
function item(r){
 if(r.bar){const m=S[r.bar],p=Math.min(100,m/lim(S[r.max])*100);return `<div class="bar"><span>${MB(m)}</span><div class="tr"><i style="width:${p}%"></i></div><b class="va">${Math.round(p)}%</b><button class="cb" data-fn="cc" data-k="${r.bar}">Clear cache</button></div>`}
 const sub=typeof r.sub=="function"?r.sub():r.o?S[r.k]:r.sub;
 return `<button class="it" ${r.go?`data-go="${r.go}"`:""}${r.k&&r.o?` data-sel="${r.k}"`:""}${r.tg?` data-tg="${r.k}"`:""}${r.fn?` data-fn="${r.fn}"`:""}>${I(r.i)}<div class="tx"><div class="t">${r.t}</div>${sub?`<div class="s ${r.o||r.a?"a":""}">${sub}</div>`:""}</div>${r.tg?`<div class="tg ${S[r.k]?"on":""}"></div>`:""}</button>`}
function settings(n){const p=PAGES[n];let h=hd(p.h);
 p.c.forEach(b=>{if(Array.isArray(b))h+=`<div class="grp">${b.map(r=>item(r.t&&r.go!==undefined||!r.go&&r.t?r:r)).join("")}</div>`;else if(b.s)h+=`<div class="sh">${b.s}</div>`;else if(b.n)h+=`<div class="note">${I("info")}<div>${b.n}</div></div>`;
 else if(b.about)h+=`<div class="about"><svg viewBox="0 0 24 24" style="width:150px;fill:var(--tx)"><path d="${P.music}"/></svg><h3>Sonifyr</h3><div>Version 1.3.6</div><p style="color:var(--sub)">The latest version is already installed</p></div>`});
 return h}
function render(){const r=route[route.length-1];$("#pg").innerHTML=r=="home"?home():r=="search"?search():r=="offline"?hd("Offline")+`<div class="list">${S.off.map(i=>songRow(byId(i))).join("")}</div>`:settings(r);
 renderMini();if(r=="search"){const i=$("#qi");if(i){i.focus();i.setSelectionRange(q.length,q.length)}}}
function renderMini(){const s=byId(S.cur);$("#mini").innerHTML=`${art(s)}<div class="m"><b>${s.t}</b><span>${s.a}</span></div><div class="ct"><button data-ct="prev" aria-label="Previous">${I("prev")}</button><button data-ct="pp" aria-label="Play or pause">${I(playing?"pause":"play")}</button><button data-ct="next" aria-label="Next">${I("next")}</button></div>`;renderFull()}
function wave(p){let d="M0 20";for(let x=0;x<=300;x+=2)d+=` L${x} ${20+Math.sin(x/9)*(playing?7:4)}`;
 const w=S.prog=="Wave"?`<path d="${d}" stroke="var(--ln)" stroke-width="4" fill="none" stroke-linecap="round"/><clipPath id="cp"><rect width="${p*3}" height="40"/></clipPath><path d="${d}" stroke="var(--acc)" stroke-width="4" fill="none" stroke-linecap="round" clip-path="url(#cp)"/>`:`<line x1="0" y1="20" x2="300" y2="20" stroke="var(--ln)" stroke-width="6" stroke-linecap="round"/><line x1="0" y1="20" x2="${p*3}" y2="20" stroke="var(--acc)" stroke-width="6" stroke-linecap="round"/><circle cx="${p*3}" cy="20" r="9" fill="var(--acc)"/>`;
 return `<svg viewBox="-6 0 312 40" preserveAspectRatio="none" style="width:100%;height:40px">${w}</svg>`}
function renderFull(){const s=byId(S.cur),p=pos/s.d*100;$("#full").className=($("#full").classList.contains("open")?"open ":"")+(S.layout=="Compact"?"cmp":"");
 $("#full").innerHTML=`<div style="width:100%;display:flex;justify-content:space-between"><button data-ct="close" aria-label="Close">${I("back").replace("<svg","<svg style='transform:rotate(-90deg)'")}</button><button data-fav="${s.id}" aria-label="Favorite" style="color:${S.fav.includes(s.id)?"#e0405f":"var(--tx)"}">${I("heart")}</button></div>${art(s)}<h3>${s.t}</h3><p>${s.a}</p>
 <div class="pr" id="pr">${wave(p)}</div><div class="tm"><span>${fmt(pos)}</span><span>${fmt(s.d)}</span></div>
 <div class="cts"><button data-ct="prev">${I("prev")}</button><button class="big" data-ct="pp">${I(playing?"pause":"play")}</button><button data-ct="next">${I("next")}</button></div>`}
function play(id){S.cur=id;pos=0;playing=true;S.plays++;save();startTick();renderMini()}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(!playing)return;pos++;const s=byId(S.cur);if(pos>=s.d)return step(1);const f=$("#full.open");if(f)renderFull()},1000)}
function step(d){const i=SONGS.findIndex(s=>s.id==S.cur);S.cur=SONGS[(i+d+SONGS.length)%SONGS.length].id;pos=0;save();renderMini()}
function menu(id){const s=byId(id),f=S.fav.includes(id),fo=S.fol.includes(s.a);
 $("#bx").innerHTML=`<div class="song">${art(s)}<div class="m"><b>${s.t}</b><span>${s.a}</span></div></div>
 <button class="it" data-m="play" data-id="${id}">${I("play")}<div class="tx t">Play</div></button><button class="it" data-m="fav" data-id="${id}">${I("heart")}<div class="tx t">${f?"Remove from favorites":"Add to favorites"}</div></button>
 <button class="it" data-m="fol" data-id="${id}">${I("user")}<div class="tx t">${fo?"Unfollow "+s.a:"Follow "+s.a}</div></button>`;$("#sheet").classList.add("open")}
const closeSheet=()=>$("#sheet").classList.remove("open");
function back(){if(route.length>1){route.pop();q="";render()}}
const FN={bk(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sonifyr-backup.json";a.click();toast("Backup exported")},
rs(){const f=document.createElement("input");f.type="file";f.accept=".json";f.onchange=()=>f.files[0].text().then(t=>{try{S=Object.assign({},def,JSON.parse(t));save();applyTheme();render();toast("Database restored")}catch(e){toast("Invalid backup file")}});f.click()},
pl(){toast("Player settings aren’t available yet")},rq(){S.plays=0;save();render();toast("Quick picks reset")},cc(e){S[e.dataset.k]=0;save();render();toast("Cache cleared")}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-go],[data-back],[data-sel],[data-tg],[data-fn],[data-play],[data-menu],[data-ct],[data-fav],[data-m],[data-rs],[data-rm],[data-unf],#clr,#newpl,#mic,#sheet");if(!t)return;
 if(t.id=="sheet"&&e.target.id!="sheet")return;const d=t.dataset;
 if(t.id=="sheet")return closeSheet();
 if(d.menu)return e.stopPropagation(),menu(+d.menu);
 if(d.m){const id=+d.id,s=byId(id);closeSheet();if(d.m=="play")play(id);if(d.m=="fav"){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];toast(S.fav.includes(id)?"Added to favorites":"Removed from favorites")}
  if(d.m=="fol"){S.fol=S.fol.includes(s.a)?S.fol.filter(x=>x!=s.a):[...S.fol,s.a];toast(S.fol.includes(s.a)?"Following "+s.a:"Unfollowed "+s.a)}save();return render()}
 if(d.tab){tab=d.tab;return render()}
 if(d.go){route.push(d.go);return render()}
 if("back" in d)return back();
 if(d.sel){const o=Object.values(PAGES).flatMap(p=>p.c.flat()).find(r=>r&&r.k==d.sel&&r.o).o;S[d.sel]=o[(o.indexOf(S[d.sel])+1)%o.length];save();if(d.sel=="theme")applyTheme();return render()}
 if(d.tg){S[d.tg]=!S[d.tg];save();return render()}
 if(d.fn)return FN[d.fn](t);
 if(d.play){if(S.cur==+d.play&&!playing){playing=true;startTick();return renderMini()}return play(+d.play)}
 if(d.ct){if(d.ct=="pp"){playing=!playing;startTick();return renderMini()}if(d.ct=="prev"){if(pos>5)pos=0;else step(-1);return renderMini()}if(d.ct=="next")return step(1);if(d.ct=="close")return $("#full").classList.remove("open")}
 if(d.fav){const id=+d.fav;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];save();return renderFull()}
 if(d.rs!==undefined){q=S.recent[+d.rs];return render()}
 if(d.rm!==undefined){e.stopPropagation();S.recent.splice(+d.rm,1);save();return render()}
 if(d.unf){S.fol=S.fol.filter(x=>x!=d.unf);save();return render()}
 if(t.id=="clr"){S.recent=[];save();return render()}
 if(t.id=="newpl"){const n=prompt("Playlist name");if(n&&n.trim()){S.pl.push(n.trim());save();render()}return}
 if(t.id=="mic")toast("Voice search needs microphone access")});
$("#mini").addEventListener("click",e=>{if(!e.target.closest("[data-ct]"))$("#full").classList.add("open")});
document.addEventListener("input",e=>{if(e.target.id=="qi"){q=e.target.value;$("#sr").innerHTML=sres()}});
document.addEventListener("keydown",e=>{if(e.target.id=="qi"&&e.key=="Enter"&&q.trim()&&!S.pauseHist){S.recent=[q.trim(),...S.recent.filter(x=>x!=q.trim())].slice(0,8);save()}});
document.addEventListener("pointerdown",e=>{const b=e.target.closest("#pr");if(!b)return;const mv=ev=>{const r=b.getBoundingClientRect();pos=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*byId(S.cur).d;renderFull();};mv(e);const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};addEventListener("pointermove",mv);addEventListener("pointerup",up)});
applyTheme();render();
</script>
</body>
</html>
